[Constants]
global $background = 0
global $mod_active = 1
; global $cabinet_rendered = 0

[KeyModActive]
key = VK_F11
type = cycle
$mod_active = 0,1

[Present]
$background = $background - 1
; $notebook = $notebook - 1
; $cabinet_rendered = $cabinet_rendered - 1

[TextureOverrideFog]
if $background > 0 && $mod_active == 1
    hash = 76356839
    handling = skip
endif

[TextureOverrideMapBG]
hash = 52e23fd2
$background = 2

