namespace = UIDOFF

[Constants]
global $LoadingScreenShown = 0
global $InGame = 0
global $GameFinishProtection = 0
global $GameStartProtection = 0
global $scriptID = 0

[Present]
if $modON
    $scriptID = 0

    ; Game Start Protection (6 sec)
    if $GameStartProtection > 0
        post $GameStartProtection = $GameStartProtection - 1
        $scriptID = 1
    endif

    if $mainSceneID == 6
        $LoadingScreenShown = 1
    else if $LoadingScreenShown == 1
        $GameStartProtection = 360
        $LoadingScreenShown = 0
    endif

    ; Game Finish Protection (6 sec)
    if $GameFinishProtection > 0
        post $GameFinishProtection = $GameFinishProtection - 1
        $scriptID = 2
    endif

    if $mainSceneID == 5
        $InGame = 1
    else if $InGame == 1
        $GameFinishProtection = 360
        $InGame = 0
    endif
endif