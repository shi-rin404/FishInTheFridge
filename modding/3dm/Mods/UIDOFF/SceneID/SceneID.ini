namespace = UIDOFF

[Constants]
global $mainTimer = 1
global $sideTimer = 1
global $conditionTimer = 1

global $mainSceneID
global $sideSceneID
global $conditionID

[Present]
if $modON
	if $mainTimer > 0
		x = $mainSceneID    
		post $mainTimer = $mainTimer - 1
	else
		x = 0
	endif

	if $sideTimer > 0
		y = $sideSceneID
		post $sideTimer = $sideTimer - 1
	else
		y = 0
	endif

	if $conditionTimer > 0
		z = $conditionID
		post $conditionTimer = $conditionTimer - 1
	else
		z = 0
	endif
endif